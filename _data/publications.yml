# Publications, newest-first (this order is what renders — grouping by year
# on the page is derived from `year` below, not from a hand-maintained list).
#
# Each entry has a `key` that names its files: assets/pdf/{key}.pdf and
# assets/img/publication_preview/{key}.png. Both are optional — if a file at
# that path doesn't exist, its element (PDF button / preview image) is
# simply omitted. There's no separate `pdf:`/`preview:` field to keep in
# sync; the key IS the filename (minus extension), so it can't drift.
#
# key naming convention — see bin/add_publication for a script that follows
# this automatically:
#   published:   {first-author-lastname}_{venue-abbrev}_{year}
#                e.g. mukherjee_vis_2021, suresh_cogsci_2025
#   unpublished: {first-author-lastname}_{topic-word}_prepub
#                e.g. verma_chart6_prepub — rename to the real key once
#                accepted somewhere, since "prepub" is a provisional marker
#   collisions:  if the same author has two entries in the same venue/year,
#                append a short disambiguator: studdiford_colm_2026_steering
#                / studdiford_colm_2026_factors
#
# Other fields:
#   title     required
#   authors   required — list of {first, last}; use "Kushin"/"Mukherjee" for
#             yourself, it renders bold
#   journal   optional — venue name
#   year      required — a number, or the string "pre-pub" to suppress the
#             year in the citation line
#   badge     optional — bold-italic award line under the title
#   progress  optional — italic status next to the title, e.g. "(in press)"
#   note      optional — second citation line, e.g. "Also appeared in..."

