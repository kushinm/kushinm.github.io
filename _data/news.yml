# Newest first. Full list rendered at /news/; homepage shows the top N
# (see `news_limit` usage in index.md).
- date: 2025-06-05
  text: >-
    Our paper **AI-enhanced semantic feature norms for 786 concepts** was accepted to both the
    [BiAlign Workshop at ICLR](https://bialign-workshop.github.io/#/), where it won the Best Paper
    Award 🥇, and to [CogSci 2025](https://cognitivesciencesociety.org/conference-awards/) where it
    won the Computaional Modeling Prize in Applied Cognition 🏆!

- date: 2025-03-21
  text: >-
    I defended my dissertation and am now a postdoctoral scholar at Stanford in the Cognitive Tools
    Lab!

- date: 2024-03-05
  text: >-
    [Two papers](/publications/) accepted to the [ICLR 2024 Workshop on Representational
    Alignment](https://representational-alignment.github.io/)! Stay tuned for preprints!

- date: 2024-02-01
  text: >-
    I will be interning at [Apple Machine Learning Research](https://machinelearning.apple.com/),
    Cambridge this summer! Excited to be back on the east coast for a bit~

- date: 2023-10-06
  text: >-
    Excited that our paper **Conceptual structure coheres in human cognition but not in large
    language models** was accepted to [EMNLP 2023](https://2023.emnlp.org/)! Preprint forthcoming!

- date: 2023-10-06
  text: >-
    Our paper **SEVA: Leveraging sketches to evaluate alignment between human and machine visual
    abstraction** was accepted to the [NeurIPS Datasets and Benchmarks
    track](https://nips.cc/Conferences/2023/CallForDatasetsBenchmarks)! See publications for more!

- date: 2023-08-01
  text: >-
    Our paper **Leveraging Artificial Neural Networks to Enhance Diagnostic Efficiency in Autism
    Spectrum Disorder: A Study on Facial Emotion Recognition** was accepted for an oral at [CCN
    2023](https://2023.ccneuro.org/)! Looking forward to seeing everyone in England!

- date: 2023-07-26
  text: >-
    We presented two posters at [CogSci 2023](https://cognitivesciencesociety.org/cogsci-2023/).
    **Evaluating machine comprehension of sketch meaning at different levels of abstraction** and
    **Behavioral estimates of conceptual structure are robust across tasks in humans but not large
    language models**. See publications for more details~

- date: 2023-04-11
  text: >-
    I will be giving a talk at the [UW-Madison ML+X
    forum](https://datascience.wisc.edu/ml-community/#community-events) on Representations for
    Learning.

- date: 2023-04-10
  text: >-
    We have 2 papers accepted to ICLR's inaugural [TinyPapers
    Track](https://iclr.cc/Conferences/2023/CallForTinyPapers). Preprints forthcoming!

- date: 2023-02-01
  text: >-
    I will be giving an invited talk at the Wisconsin Institute for Discovery on [Characterizing
    the Building Blocks of Human Perceptual Similarity in Abstract Drawings Using Deep Neural
    Networks](https://wid.wisc.edu/event/wid-seminar-series-02012023/).

- date: 2022-07-27
  text: >-
    I will be co-organizing a CogSci 2022 pre-conference workshop titled ["From Images to Symbols:
    Drawing as a Window into the Mind"](https://images2symbols.github.io/) with Holly Huey, Judy
    Fan, and Tim Rogers.

- date: 2021-10-24
  text: >-
    Our paper [Context Matters: A Theory of Semantic Discriminability for Perceptual Encoding
    Systems](/assets/pdf/mukherjee_vis_2021.pdf) received a [Best Paper Honorable
    Mention](https://ieeevis.org/year/2021/info/awards/best-paper-awards) at IEEE Vis 2021.
