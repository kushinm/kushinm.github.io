<header>
  <nav id="navbar" class="navbar navbar-light navbar-expand-sm {% if site.navbar_fixed %}fixed-top{% else %}sticky-top{% endif %}">
    <div class="container">
      {% if page.url == '/' %}
      <!-- Social icons take the brand slot on the homepage, matching the old site -->
      <div class="navbar-brand social">
        {% include social.html %}
      </div>
      {% else %}
      <a class="navbar-brand title font-weight-lighter" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      {% endif %}

      <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar top-bar"></span>
        <span class="icon-bar middle-bar"></span>
        <span class="icon-bar bottom-bar"></span>
      </button>

      <div class="collapse navbar-collapse text-right" id="navbarNav">
        <ul class="navbar-nav ml-auto flex-nowrap">
          <li class="nav-item {% if page.url == '/' %}active{% endif %}">
            <a class="nav-link" href="{{ '/' | relative_url }}">home{% if page.url == '/' %}<span class="sr-only"> (current)</span>{% endif %}</a>
          </li>
          <li class="nav-item {% if page.url == '/publications/' %}active{% endif %}">
            <a class="nav-link" href="{{ '/publications/' | relative_url }}">publications{% if page.url == '/publications/' %}<span class="sr-only"> (current)</span>{% endif %}</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ '/assets/pdf/KM_CV_2026.pdf' | relative_url }}" target="_blank">cv</a>
          </li>
          <li class="nav-item {% if page.url == '/personal/' %}active{% endif %}">
            <a class="nav-link" href="{{ '/personal/' | relative_url }}">personal{% if page.url == '/personal/' %}<span class="sr-only"> (current)</span>{% endif %}</a>
          </li>
        </ul>
      </div>
    </div>
    <div id="scroll-progress-container" class="scroll-progress-container">
      <div id="scroll-progress-bar" class="scroll-progress-bar"></div>
    </div>
  </nav>
</header>
